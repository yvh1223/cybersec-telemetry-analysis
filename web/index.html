<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McAfee Cybersecurity Telemetry Analytics Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/telemetry-grid.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <div class="logo-section">
                    <i class="fas fa-shield-alt logo-icon"></i>
                    <h1>McAfee Cybersecurity Analytics</h1>
                </div>
                <div class="header-stats">
                    <div class="stat-item">
                        <span class="stat-value" id="totalDevices">100,000</span>
                        <span class="stat-label">Devices</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="totalScans">520,000</span>
                        <span class="stat-label">Daily Logs</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="threatsFound">15,980</span>
                        <span class="stat-label">Threats</span>
                    </div>
                </div>
                <div class="author-info">
                    <span>Portfolio by <strong>Yallappa H</strong></span>
                    <a href="https://www.linkedin.com/in/yallappa/" target="_blank" class="linkedin-link">
                        <i class="fab fa-linkedin"></i>
                    </a>
                </div>
            </div>
        </header>
